name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create or refresh a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e 'if (!require("./release-state.json").isDraft) process.exit(1)'
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft "${prerelease[@]}" --title "TraceCase $RELEASE_TAG" --notes-file release/RELEASE_NOTES.md
          fi
