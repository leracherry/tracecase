name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run schema && git diff --exit-code -- docs/tracecase.schema.json
      - if: matrix.node == 22
        run: npm run release:pack
      - if: matrix.node == 22
        run: npm run release:smoke
      - if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 14
