<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width"
  /><title>TraceCase · Demo checkout</title>
  <link rel="stylesheet" href="/tracecase-select.css" />
  <style>
    body {
      background: #f2f0e9;
      color: #182a27;
      font: 16px system-ui;
      max-width: 680px;
      margin: 70px auto;
      padding: 24px;
    }
    small {
      letter-spacing: 3px;
    }
    h1 {
      font-size: 46px;
    }
    form {
      padding: 32px;
      background: white;
      border-radius: 14px;
      display: grid;
      gap: 12px;
    }
    input,
    select,
    button {
      font: inherit;
      padding: 12px;
      border: 1px solid #c9d1cc;
      border-radius: 6px;
    }
    button {
      background: #185b46;
      color: white;
      cursor: pointer;
    }
    #status {
      padding: 20px 0;
    }
    aside {
      margin: 30px 0;
      line-height: 1.7;
    }
  </style>
  <small>TRACECASE / DEMO STORE</small>
  <h1>A small checkout.<br />A runnable bug.</h1>
  <aside>
    Select Canada, enter a postal code, and continue. The tax service fails.
    Record the actions, replay them, then verify the fix.
  </aside>
  <button type="button" data-testid="change-address" id="change-address">
    Change address</button
  ><a href="/checkout?return=1">Restart checkout</a>
  <form id="checkout">
    <label for="country">Country</label
    ><select id="country" data-testid="country">
      <option value="US">United States</option>
      <option value="CA">Canada</option></select
    ><label for="postal">Postal code</label
    ><input
      id="postal"
      data-testid="postal"
      placeholder="V7M 1A1"
      required
    /><button type="submit" data-testid="continue">Continue</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
  <script>
    document
      .querySelector("#change-address")
      .addEventListener("click", () =>
        history.pushState({}, "", location.pathname + "?address=edit"),
      );
    document.querySelector("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.querySelector("#status");
      status.textContent = "Calculating tax…";
      try {
        const response = await fetch(
          "/api/tax?country=" + document.querySelector("#country").value,
        );
        status.textContent = response.ok
          ? "Order summary is visible"
          : "Tax service unavailable";
      } catch {
        status.textContent = "Unable to contact tax service";
      }
    });
  </script>
</html>
